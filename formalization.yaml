version: "v0.4"

project:
  name: "Additive VC_2 Dimension of Convex Sets in R^3"
  description: >-
    A complete, elementary Lean 4 proof that every convex set in R^3 has additive
    VC_2-dimension at most 2, settling the open conjecture
    VCDimConvex.hasAddVCNDimAtMost_two_two_of_convex_r3 from Google DeepMind's
    Formal Conjectures repository. Combined with Kenta Kitamura's 2x2 lower bound,
    this determines the exact value VC_2(convex sets in R^3) = 2 (improving the
    previous finite upper bound of 2^128 - 1). The proof uses no topology, no
    Hahn-Banach theorem, and no closedness assumptions on C: it shows no coplanar
    2x3 grid is in convex position, reduces any non-degenerate 3x3 grid via an
    explicit invertible affine map to paraboloid normal form, and derives a 4-point
    convex combination contradiction from just two 7-point masks.
  authors:
    - "n1ghtr1der365"
  license: "Apache-2.0"
  responsible_maintainers:
    - "n1ghtr1der365"

classification:
  arxiv: ["math.CO", "math.MG"]
  msc2020: ["52A15", "05D05"]

sources:
