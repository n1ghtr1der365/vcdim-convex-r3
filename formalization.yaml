    Fully proves VCDimConvex.hasAddVCNDimAtMost_two_two_of_convex_r3 with no
    extra hypotheses (C is an arbitrary convex subset of EuclideanSpace R (Fin 3),
    not assumed closed, bounded, or polyhedral). Also includes an independent
    Python exact-integer certificate (cert_2x3.json) showing a 2x3 prism is
    shatterable by a 13-halfspace polytope, demonstrating minimality of 3x3.
  sorry_count: 0
  sorry_in_definitions: 0
