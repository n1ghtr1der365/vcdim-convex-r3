    type: "original-proof"
    relationship: "other"
    note: "First presentation and Lean 4 formalization of the elementary proof settling the open conjecture."
  - title: "Formal Conjectures: VCDimConvex.hasAddVCNDimAtMost_two_two_of_convex_r3"
    id: "https://github.com/google-deepmind/formal-conjectures/blob/ea8e3e198ded6fc73efb7f5653b74b28ac4ae1a8/FormalConjectures/Other/VCDimConvex.lean#L69-L72"
    type: "formalization"
    location: "https://github.com/google-deepmind/formal-conjectures"
    relationship: "background"
    license: "Apache-2.0"
    note: "Statement of the open conjecture targeted by this proof."

related_formalizations:
  - id: "https://github.com/KitaKen1/vcdim-convex-counterexample"
    relationship: "independent"
    note: "Establishes the matching lower bound VC_2(convex sets in R^3) >= 2 via a 2x2 grid."
  - id: "https://github.com/KitaKen1/vcdim-convex-finite-bound"
    relationship: "supersedes"
    note: "Proves the general finite upper bound d = 2^(8*(n+2)^n) - 1 (which gives 2^128 - 1 for n = 2); our proof sharpens n = 2 to the exact value 2."

status:
